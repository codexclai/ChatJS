name: Bug report
description: Report a reproducible defect in ChatJS.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, API keys, cookies, private conversations, or proprietary app assets."
  - type: input
    id: commit
    attributes:
      label: Git commit or repository link
      placeholder: "Commit reference or URL"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js runtime
      placeholder: "node --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, personal data, and private content.
    validations:
      required: false
