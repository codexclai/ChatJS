name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (current Node.js LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up current Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'lts/*'
      - name: Run checks, tests, and build archive
        run: npm run check
      - name: Extract and smoke-test ChatJS as an installed module
        run: |
          mkdir -p "$RUNNER_TEMP/chatjs-consumer/node_modules/ChatJS"
          tar -xzf dist/ChatJS.tar.gz -C "$RUNNER_TEMP/chatjs-consumer/node_modules/ChatJS" --strip-components=1
          cd "$RUNNER_TEMP/chatjs-consumer"
          node -e "const ChatJS = require('ChatJS'); const client = ChatJS.create(); if (client.getStatus().state !== 'initialized') process.exit(1); client.close();"
          node --input-type=module -e "import ChatJS from 'ChatJS'; const client = ChatJS.create(); if (client.getStatus().state !== 'initialized') process.exit(1); client.close();"
      - name: Upload the ChatJS module archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ChatJS
          path: dist/ChatJS.tar.gz
          if-no-files-found: error
          retention-days: 14
