name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".project/**"
      - "scripts/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".project/**"
      - "scripts/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: generated state and link validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - run: npm run docs:check
